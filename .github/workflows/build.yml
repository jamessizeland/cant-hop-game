name: "publish app"

on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    # This is to ensure that only the owner can publish the app.
    if: ${{ github.event.pull_request.merged && github.repository_owner == 'jamessizeland' }} 
    needs: publish-android
    name: "Publish Tauri App"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          key: desktop-${{ matrix.platform }}
          cache-on-failure: true

      - name: install dependencies (ubuntu only)
        # Only run for the Linux desktop build, not the Android build (which also uses ubuntu-24.04 runner)
        if: matrix.platform == 'ubuntu-24.04' && matrix.args == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: build and publish Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  publish-android:
    if: ${{ github.event.pull_request.merged && github.repository_owner == 'jamessizeland' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_NAME: cant-hop
    steps:
      - uses: actions/checkout@v6

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.11902837
          key: ndk-${{ runner.os }}-27.0.11902837

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      - name: Install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;27.0.11902837"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
          key: android
          cache-on-failure: true

      - name: setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          cd ../../..

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Tauri App Version
        id: app-version
        run: |
          VERSION_STRING=$(grep '^version = "' src-tauri/Cargo.toml | head -n 1 | sed -e 's/version = "//' -e 's/"//')
          if [ -z "$VERSION_STRING" ] || [ "$VERSION_STRING" = "null" ]; then
            echo "Error: Version not found or is invalid in src-tauri/Cargo.toml."
            exit 1
          fi
          echo "version_string=$VERSION_STRING" >> "$GITHUB_OUTPUT"

      - name: Build Android APKs
        run: bun tauri android build --apk --split-per-abi -v
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.11902837
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename and sign APK files
        env:
          VERSION: ${{ steps.app-version.outputs.version_string }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          declare -A APK_OUTPUTS=(
            [arm64]="android-arm64"
            [arm]="android-arm"
            [x86]="android-x86"
            [x86_64]="android-x86_64"
          )

          for ABI in "${!APK_OUTPUTS[@]}"; do
            SRC="./src-tauri/gen/android/app/build/outputs/apk/${ABI}/release/app-${ABI}-release.apk"
            DEST="./src-tauri/gen/android/app/build/outputs/apk/${ABI}/release/${APP_NAME}-${VERSION}-${APK_OUTPUTS[$ABI]}.apk"
            if [ ! -f "$SRC" ]; then
              echo "Expected APK not found: $SRC"
              exit 1
            fi
            mv "$SRC" "$DEST"
            bun tauri signer sign "$DEST"
          done

      - name: Publish Android APKs
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          name: App v${{ steps.app-version.outputs.version_string }}
          tag_name: app-v${{ steps.app-version.outputs.version_string }}
          body: "See the assets to download this version and install."
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            ./src-tauri/gen/android/app/build/outputs/apk/arm64/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-arm64.apk
            ./src-tauri/gen/android/app/build/outputs/apk/arm64/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-arm64.apk.sig
            ./src-tauri/gen/android/app/build/outputs/apk/arm/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-arm.apk
            ./src-tauri/gen/android/app/build/outputs/apk/arm/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-arm.apk.sig
            ./src-tauri/gen/android/app/build/outputs/apk/x86/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-x86.apk
            ./src-tauri/gen/android/app/build/outputs/apk/x86/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-x86.apk.sig
            ./src-tauri/gen/android/app/build/outputs/apk/x86_64/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-x86_64.apk
            ./src-tauri/gen/android/app/build/outputs/apk/x86_64/release/${{env.APP_NAME}}-${{ steps.app-version.outputs.version_string }}-android-x86_64.apk.sig

      - name: Add signed Android entries to updater manifest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.app-version.outputs.version_string }}
        run: |
          TAG="app-v${VERSION}"
          MANIFEST="$RUNNER_TEMP/latest.json"
          export MANIFEST

          if ! gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP" --clobber; then
            printf '{"version":"%s","notes":"See the assets to download this version and install.","platforms":{}}\n' "$VERSION" > "$MANIFEST"
          fi

          python3 - <<'PY'
          import json
          import os

          manifest_path = os.environ["MANIFEST"]
          version = os.environ["VERSION"]
          tag = f"app-v{version}"
          app_name = os.environ["APP_NAME"]
          base_url = f"https://github.com/jamessizeland/cant-hop-game/releases/download/{tag}"
          apk_dirs = {
              "android-arm64": "arm64",
              "android-arm": "arm",
              "android-x86": "x86",
              "android-x86_64": "x86_64",
          }

          with open(manifest_path, "r", encoding="utf-8") as file:
              manifest = json.load(file)

          manifest["version"] = version
          manifest.setdefault("notes", "See the assets to download this version and install.")
          platforms = manifest.setdefault("platforms", {})

          for target, apk_dir in apk_dirs.items():
              apk_name = f"{app_name}-{version}-{target}.apk"
              signature_path = (
                  f"src-tauri/gen/android/app/build/outputs/apk/{apk_dir}/"
                  f"release/{apk_name}.sig"
              )
              with open(signature_path, "r", encoding="utf-8") as file:
                  signature = file.read().strip()
              platforms[target] = {
                  "signature": signature,
                  "url": f"{base_url}/{apk_name}",
              }

          with open(manifest_path, "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2)
              file.write("\n")
          PY

          gh release upload "$TAG" "$MANIFEST" --clobber
          gh release edit "$TAG" --latest

  finalize-android-manifest:
    if: ${{ always() && github.event.pull_request.merged && github.repository_owner == 'jamessizeland' && needs.publish-android.result == 'success' }}
    needs:
      - publish-android
      - publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_NAME: cant-hop
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Tauri App Version
        id: app-version
        run: |
          VERSION_STRING=$(grep '^version = "' src-tauri/Cargo.toml | head -n 1 | sed -e 's/version = "//' -e 's/"//')
          if [ -z "$VERSION_STRING" ] || [ "$VERSION_STRING" = "null" ]; then
            echo "Error: Version not found or is invalid in src-tauri/Cargo.toml."
            exit 1
          fi
          echo "version_string=$VERSION_STRING" >> "$GITHUB_OUTPUT"

      - name: Restore Android updater entries
        env:
          VERSION: ${{ steps.app-version.outputs.version_string }}
        run: |
          TAG="app-v${VERSION}"
          MANIFEST="$RUNNER_TEMP/latest.json"
          SIG_DIR="$RUNNER_TEMP/android-sigs"
          mkdir -p "$SIG_DIR"
          export MANIFEST SIG_DIR

          if ! gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP" --clobber; then
            printf '{"version":"%s","notes":"See the assets to download this version and install.","platforms":{}}\n' "$VERSION" > "$MANIFEST"
          fi

          gh release download "$TAG" --pattern "${APP_NAME}-${VERSION}-android-*.apk.sig" --dir "$SIG_DIR" --clobber

          python3 - <<'PY'
          import json
          import os

          manifest_path = os.environ["MANIFEST"]
          version = os.environ["VERSION"]
          tag = f"app-v{version}"
          app_name = os.environ["APP_NAME"]
          sig_dir = os.environ["SIG_DIR"]
          base_url = f"https://github.com/jamessizeland/cant-hop-game/releases/download/{tag}"
          targets = [
              "android-arm64",
              "android-arm",
              "android-x86",
              "android-x86_64",
          ]

          with open(manifest_path, "r", encoding="utf-8") as file:
              manifest = json.load(file)

          manifest["version"] = version
          manifest.setdefault("notes", "See the assets to download this version and install.")
          platforms = manifest.setdefault("platforms", {})

          for target in targets:
              apk_name = f"{app_name}-{version}-{target}.apk"
              signature_path = os.path.join(sig_dir, f"{apk_name}.sig")
              with open(signature_path, "r", encoding="utf-8") as file:
                  signature = file.read().strip()
              platforms[target] = {
                  "signature": signature,
                  "url": f"{base_url}/{apk_name}",
              }

          with open(manifest_path, "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2)
              file.write("\n")
          PY

          gh release upload "$TAG" "$MANIFEST" --clobber
          gh release edit "$TAG" --latest
